<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro candidato</title>
</head>
<body>
    
    <form action="">
    <fieldset>
        <legend>Cadastrar candidato</legend>

        <input type="text" id="input_nome" placeholder="nome"><br>
        <input type="text" id="input_email" placeholder="email"><br>
        <input type="text" id="input_estado" placeholder="estado"><br>
        <input type="text" id="input_CEP" placeholder="CEP"><br>
        <input type="text" id="input_descricao" placeholder="descricao"><br>
        <input type="number" id="input_idade" placeholder="idade" min="16"><br>
        <input type="text" id="input_CPF" placeholder="CPF"><br>
        <input type="text" id="input_competencias" placeholder="competencias"><br>



        <button id="cadastrar">Cadastrar</button>
        <input type="reset" value="Resetar">

        <p id="status"></p>
    </fieldset>
    </form>

    <br>
    <a href="../index.html">Voltar para pagina principal</a>
    <script type="module" src="../build/control/cadastro_cand.js"></script>
</body>
</html>
