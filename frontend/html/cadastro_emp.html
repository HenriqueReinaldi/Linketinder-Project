<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro empresa</title>
</head>
<body>
    
    <form action="">
    <fieldset>
        <legend>Cadastrar empresa</legend>

        <input type="text" id="input_nome" placeholder="nome"><br>
        <input type="text" id="input_email" placeholder="email"><br>
        <input type="text" id="input_estado" placeholder="estado"><br>
        <input type="text" id="input_CEP" placeholder="CEP"><br>
        <input type="text" id="input_descricao" placeholder="descricao"><br>
        <input type="text" id="input_pais" placeholder="pais"><br>
        <input type="text" id="input_CNPJ" placeholder="CNPJ"><br>
        <input type="text" id="input_competencias" placeholder="competencias desejadas"><br>



        <button id="cadastrar">Cadastrar</button>
        <input type="reset" value="Resetar">

        <p id="status"></p>
    </fieldset>
    </form>

    <br>
    <a href="../index.html">Voltar para pagina principal</a>
    <script type="module" src="../build/control/cadastro_emp.js"></script>
</body>
</html>
